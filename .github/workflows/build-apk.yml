
name: Gerar APK - Cambio Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: CambioPro
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: CambioPro-APK
          path: CambioPro/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
